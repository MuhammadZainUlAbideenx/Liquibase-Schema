name: Liquibase CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  liquibase-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liquibase_demo
        options: >-
          --health-cmd="pg_isready -U postgres -d liquibase_demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      LIQUIBASE_URL: jdbc:postgresql://localhost:5432/liquibase_demo
      LIQUIBASE_USERNAME: postgres
      LIQUIBASE_PASSWORD: postgres

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Liquibase
        run: |
          curl -L \
            https://github.com/liquibase/liquibase/releases/download/v5.0.3/liquibase-5.0.3.tar.gz \
            -o liquibase.tar.gz

          tar -xzf liquibase.tar.gz

          sudo mv liquibase /opt/liquibase
          sudo ln -sf /opt/liquibase/liquibase /usr/local/bin/liquibase

          liquibase --version

      - name: Download PostgreSQL JDBC Driver
        run: |
          mkdir -p liquibase_libs

          curl -L \
            https://jdbc.postgresql.org/download/postgresql-42.7.11.jar \
            -o liquibase_libs/postgresql.jar

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Validate Changelog
        run: |
          liquibase \
            --classpath=liquibase_libs/postgresql.jar \
            validate

      - name: Show Pending Changes
        run: |
          liquibase \
            --classpath=liquibase_libs/postgresql.jar \
            status

      - name: Apply Database Changes
        run: |
          liquibase \
            --classpath=liquibase_libs/postgresql.jar \
            update

      - name: Verify Database Is Up-to-date
        run: |
          liquibase \
            --classpath=liquibase_libs/postgresql.jar \
            status --verbose

      - name: Validate Again
        run: |
          liquibase \
            --classpath=liquibase_libs/postgresql.jar \
            validate
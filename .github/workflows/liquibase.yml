name: Liquibase CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  liquibase-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liquibase_demo
        options: >-
          --health-cmd="pg_isready -U postgres -d liquibase_demo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Liquibase
        run: |
          set -e

          curl -L \
            https://github.com/liquibase/liquibase/releases/download/v5.0.3/liquibase-5.0.3.tar.gz \
            -o liquibase.tar.gz

          mkdir liquibase-home

          tar -xzf liquibase.tar.gz -C liquibase-home

          chmod +x liquibase-home/liquibase

          sudo mv liquibase-home /opt/liquibase

          sudo ln -sf /opt/liquibase/liquibase /usr/local/bin/liquibase

      - name: Verify Liquibase Installation
        run: liquibase --version

      - name: Verify PostgreSQL JDBC Driver
        run: |
          ls -lh liquibase_libs/postgresql.jar

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Validate Changelog
        run: |
          liquibase validate

      - name: Show Pending Changes
        run: |
          liquibase status

      - name: Apply Database Changes
        env:
          DATADOG_PASSWORD: ${{ secrets.DATADOG_PASSWORD }}
        run: |
          liquibase \
            -Ddatadog.password="$DATADOG_PASSWORD" \
            update

      - name: Verify Database Is Up-to-date
        run: |
          liquibase status --verbose

      - name: Validate Again
        run: |
          liquibase validate